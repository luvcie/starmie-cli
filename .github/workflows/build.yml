name: Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to upload assets to (e.g. v1.0.0)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Build binaries
        run: |
          mkdir -p dist
          bun build --compile --target=bun-linux-x64     pokescope.ts --outfile dist/pokescope-linux-x64
          bun build --compile --target=bun-linux-arm64   pokescope.ts --outfile dist/pokescope-linux-arm64
          bun build --compile --target=bun-darwin-x64    pokescope.ts --outfile dist/pokescope-macos-x64
          bun build --compile --target=bun-darwin-arm64  pokescope.ts --outfile dist/pokescope-macos-arm64
          bun build --compile --target=bun-windows-x64   pokescope.ts --outfile dist/pokescope-windows-x64.exe

      - name: Upload to release
        run: gh release upload ${{ inputs.tag || github.event.release.tag_name }} dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
