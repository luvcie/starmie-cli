name: Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - uses: cycjimmy/semantic-release-action@v4
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload binaries
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          mkdir -p dist
          bun build --compile --target=bun-linux-x64     starmie-cli.ts --outfile dist/starmie-cli-linux-x64
          bun build --compile --target=bun-linux-arm64   starmie-cli.ts --outfile dist/starmie-cli-linux-arm64
          bun build --compile --target=bun-darwin-x64    starmie-cli.ts --outfile dist/starmie-cli-macos-x64
          bun build --compile --target=bun-darwin-arm64  starmie-cli.ts --outfile dist/starmie-cli-macos-arm64
          bun build --compile --target=bun-windows-x64   starmie-cli.ts --outfile dist/starmie-cli-windows-x64.exe
          gh release upload v${{ steps.semantic.outputs.new_release_version }} dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
