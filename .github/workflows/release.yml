name: Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - uses: cycjimmy/semantic-release-action@v4
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload binaries
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          mkdir -p dist
          bun build --compile --target=bun-linux-x64     starmie-cli.ts --outfile dist/starmie-cli-linux-x64
          bun build --compile --target=bun-linux-arm64   starmie-cli.ts --outfile dist/starmie-cli-linux-arm64
          bun build --compile --target=bun-darwin-x64    starmie-cli.ts --outfile dist/starmie-cli-macos-x64
          bun build --compile --target=bun-darwin-arm64  starmie-cli.ts --outfile dist/starmie-cli-macos-arm64
          bun build --compile --target=bun-windows-x64   starmie-cli.ts --outfile dist/starmie-cli-windows-x64.exe
          gh release upload v${{ steps.semantic.outputs.new_release_version }} dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update prebuilt binary hashes in flake
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          VERSION=${{ steps.semantic.outputs.new_release_version }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          sri() { echo "sha256-$(sha256sum "$1" | cut -d' ' -f1 | xxd -r -p | base64)"; }
          LX64=$(sri dist/starmie-cli-linux-x64)
          LA64=$(sri dist/starmie-cli-linux-arm64)
          MX64=$(sri dist/starmie-cli-macos-x64)
          MA64=$(sri dist/starmie-cli-macos-arm64)
          {
            echo '# Generated and updated by the release workflow. Do not edit by hand.'
            echo '{'
            echo "  version = \"$VERSION\";"
            echo '  hashes = {'
            echo "    \"x86_64-linux\" = \"$LX64\";"
            echo "    \"aarch64-linux\" = \"$LA64\";"
            echo "    \"x86_64-darwin\" = \"$MX64\";"
            echo "    \"aarch64-darwin\" = \"$MA64\";"
            echo '  };'
            echo '}'
          } > nix/bin-sources.nix
          git add nix/bin-sources.nix
          git commit -m "chore: update prebuilt binary hashes for v$VERSION"
          git push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
